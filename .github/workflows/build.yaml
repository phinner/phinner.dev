name: Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_NAME: ${{ vars.VITE_NAME || 'phinner' }}
          VITE_EMAIL: ${{ vars.VITE_EMAIL || 'contact@phinner.dev' }}
          VITE_LINKEDIN_URL: ${{ vars.VITE_LINKEDIN_URL }}
        run: pnpm build
